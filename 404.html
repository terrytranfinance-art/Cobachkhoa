<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Không tìm thấy trang</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f4f1ea;color:#1d2731;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 18px calc(env(safe-area-inset-bottom,0px) + 28px)}
h1{font-size:26px;margin:0 0 6px} p.sub{margin:0 0 22px;color:#5b6670;font-size:15px;line-height:1.45}
a.card{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:#fffdf8;border:1px solid #d9d3c5;border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
a.card:active{transform:scale(.98)}
.ic{flex:none;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:36px}
.t{font-size:19px;font-weight:800;margin:0 0 4px} .d{font-size:14px;color:#5b6670;line-height:1.4}
.tip{margin-top:22px;font-size:13.5px;line-height:1.5;color:#6b4a10;background:#fff7e6;border:1px solid #f1d79a;border-radius:12px;padding:10px 12px}
</style>
</head>
<body>
<main>
<h1>Ôi, lạc đường rồi 🪐</h1><p class="sub">Trang này không có. Mình quay về trang bài học nhé.</p>
<a class="card" href="/Cobachkhoa/"><span class="ic" style="background:#0f2a3a">🏠</span><span><div class="t">Về trang bài học</div></span></a>
</main>
</body>
</html>
